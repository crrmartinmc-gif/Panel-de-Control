name: Validar integracion Secretaria F5A
on:
  push:
    branches: [main]
    paths:
      - 'backend/Secretaria_Fase5A.gs'
      - 'backend/instalar-secretaria-f5a.ps1'
      - 'secretaria-panel.js'
      - 'secretaria-panel.css'
      - 'tests/test-secretaria-f5a.js'
      - '.github/workflows/secretaria-integracion.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis del módulo y de la interfaz
        run: |
          cp backend/Secretaria_Fase5A.gs /tmp/Secretaria_Fase5A.js
          node --check /tmp/Secretaria_Fase5A.js
          node --check secretaria-panel.js
          node --check tests/test-secretaria-f5a.js
      - name: Probar flujo local con planillas simuladas
        run: node tests/test-secretaria-f5a.js
      - name: Comprobar sintaxis del instalador
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'backend/instalar-secretaria-f5a.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
